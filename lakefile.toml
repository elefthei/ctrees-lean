name = "ctrees"
version = "0.1.2"
description = "Choice Trees: a Lean 4 port of the Rocq ctrees library (coinductive semantics of nondeterminism)"
keywords = ["coinduction", "bisimulation", "semantics", "interaction-trees"]
license = "MIT"
licenseFiles = ["LICENSE", "LICENSE-APACHE"]
defaultTargets = ["Coinductive", "ITree", "CTree", "Logic", "Lang", "Examples", "Test"]

[[lean_lib]]
name = "Coinductive"

[[lean_lib]]
name = "ITree"

[[lean_lib]]
name = "CTree"

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_lib]]
name = "Logic"

[[lean_lib]]
name = "Lang"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]
